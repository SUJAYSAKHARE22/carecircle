[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carecircle"
version = "0.1.0"
description = "Voice-first family check-in MCP server for Alexa+: check-ins, reminders, messages, safety alerts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
carecircle = "carecircle.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
carecircle = ["web/*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]

[tool.ruff.lint.per-file-ignores]
"src/carecircle/i18n.py" = ["E501"]   # translated strings stay on one line for reviewers
"src/carecircle/safety.py" = ["E501"] # regex rules read best unwrapped
"src/carecircle/agent.py" = ["E501"]
"tests/*" = ["E501"]
